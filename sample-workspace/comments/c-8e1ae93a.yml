response: |-
  We agree that the analysis was under-described. {{var:v-6a9512f4}} now explains how we moved from the {{var:v-90664903}} to the three mechanisms, in three steps:
  - open coding of the transcripts and field notes;
  - grouping codes into **second-order themes**, shown in a new coding table (Appendix B);
  - comparing the themes across the three depots to arrive at the mechanisms.
  See also our response to {{ref:c-a91ccf74}} on the sample.
